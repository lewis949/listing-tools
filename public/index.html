<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Tools | Claude Builder</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --accent-gradient: linear-gradient(135deg, #f43f5e, #8b5cf6, #3b82f6);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Tabs UI */
        .tabs-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .tab-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--glass-highlight);
            color: var(--text-main);
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        @media (min-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .panel-title::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gradient);
        }

        .form-section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.4);
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Radio Buttons */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-bottom: 1.5rem;
        }

        .custom-radio {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-main);
            text-transform: none;
            letter-spacing: normal;
            margin-bottom: 0;
        }

        .custom-radio input {
            accent-color: #8b5cf6;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Toggle Switch for Sets */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-bottom: 1.5rem;
        }

        .toggle-container label {
            margin-bottom: 0;
            color: var(--text-main);
            text-transform: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--accent-gradient);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Dynamic Field Animations */
        .dynamic-field {
            display: none;
            animation: slideDown 0.3s ease-out forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button.primary-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
        }

        /* Result Section */
        .result-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 12px;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.8;
            height: calc(100% - 140px);
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .empty-state {
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            display: none;
        }
        
        .copy-btn:hover {
            background: var(--glass-highlight);
        }

        .copy-btn.success {
            background: rgba(16, 185, 129, 0.8);
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Listing Tools</h1>
        <p>Claude Collaboration Builder</p>
    </div>

    <div class="layout-grid">
        <div class="panel">
            <!-- Tabs -->
            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('costumes')" id="btn-costumes">Costumes</button>
                <button class="tab-btn" onclick="switchTab('tshirts')" id="btn-tshirts">T-Shirts</button>
            </div>
            
            <h2 class="panel-title">Product Details</h2>
            
            <!-- COSTUMES FORM -->
            <form id="form-costumes" class="form-section active">
                <div class="form-group">
                    <label for="c_itemName">Item Name</label>
                    <input type="text" id="c_itemName" placeholder="e.g. Orange Dress" required>
                </div>

                <div class="form-group">
                    <label for="c_event">Event (Optional)</label>
                    <input type="text" id="c_event" placeholder="e.g. the Summer Music Festival">
                </div>

                <div class="toggle-container">
                    <label for="c_isSet">Is this product a set?</label>
                    <label class="switch">
                        <input type="checkbox" id="c_isSet" onchange="toggleSetField()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-group dynamic-field" id="setComponentsGroup">
                    <label for="c_setComponents">Set Components</label>
                    <textarea id="c_setComponents" placeholder="e.g. 1x Top, 1x Skirt"></textarea>
                </div>

                <div class="form-group">
                    <label for="c_bannedTerms">Banned Terms (Optional)</label>
                    <input type="text" id="c_bannedTerms" placeholder="e.g. Vintage, Designer-inspired">
                </div>

                <div class="form-group">
                    <label for="c_focus">Focus Theme (Optional)</label>
                    <input type="text" id="c_focus" placeholder="e.g. concert, Halloween">
                </div>

                <div class="form-group">
                    <label for="c_sizeGuide">Size Guide (Optional)</label>
                    <textarea id="c_sizeGuide" placeholder="Paste accurate measurements here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="c_extraDetails">Extra Details (Optional)</label>
                    <textarea id="c_extraDetails" placeholder="Any other specific details Claude needs to know..."></textarea>
                </div>
            </form>

            <!-- T-SHIRTS FORM -->
            <form id="form-tshirts" class="form-section">
                
                <div class="form-group">
                    <label for="t_colour">T-Shirt Colour</label>
                    <input type="text" id="t_colour" placeholder="e.g. Black, Neon Pink" required>
                </div>

                <label>Style</label>
                <div class="radio-group">
                    <label class="custom-radio">
                        <input type="radio" name="t_style" id="t_isClassic" value="Classic T-Shirt" checked>
                        Classic T-Shirt
                    </label>
                    <label class="custom-radio">
                        <input type="radio" name="t_style" id="t_isBabyTee" value="Baby Tee">
                        Baby Tee
                    </label>
                </div>

                <label>Print Location</label>
                <div class="radio-group">
                    <label class="custom-radio">
                        <input type="radio" name="t_printLocation" value="front" onchange="togglePrintFields()" checked>
                        Front Print
                    </label>
                    <label class="custom-radio">
                        <input type="radio" name="t_printLocation" value="back" onchange="togglePrintFields()">
                        Back Print
                    </label>
                    <label class="custom-radio">
                        <input type="radio" name="t_printLocation" value="both" onchange="togglePrintFields()">
                        Both
                    </label>
                </div>

                <div class="form-group dynamic-field" id="t_frontPrintGroup" style="display: block;">
                    <label for="t_frontPrint">Front Print Description</label>
                    <textarea id="t_frontPrint" placeholder="Describe the graphic or text on the front..."></textarea>
                </div>

                <div class="form-group dynamic-field" id="t_backPrintGroup">
                    <label for="t_backPrint">Back Print Description</label>
                    <textarea id="t_backPrint" placeholder="Describe the graphic or text on the back..."></textarea>
                </div>

                <div class="form-group">
                    <label for="t_bannedTerms">Banned Terms (Optional)</label>
                    <input type="text" id="t_bannedTerms" placeholder="e.g. Vintage, Designer-inspired">
                </div>

                <div class="form-group">
                    <label for="t_focus">Focus Theme (Optional)</label>
                    <input type="text" id="t_focus" placeholder="e.g. concert, Halloween">
                </div>

                <div class="form-group">
                    <label for="t_sizeGuide">Size Guide (Optional)</label>
                    <textarea id="t_sizeGuide" placeholder="Paste accurate measurements here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="t_extraDetails">Extra Details (Optional)</label>
                    <textarea id="t_extraDetails" placeholder="Any other specific details Claude needs to know..."></textarea>
                </div>
            </form>

            <!-- Generate Button (Shared) -->
            <button type="button" class="primary-btn" onclick="generatePrompt()">Generate Prompt</button>
        </div>

        <div class="panel">
            <h2 class="panel-title">Generated Prompt</h2>
            <div id="resultOutput" class="result-box">
                <div class="empty-state">Fill out the form to generate your prompt...</div>
            </div>
            <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        let currentTab = 'costumes';

        function switchTab(tab) {
            currentTab = tab;
            
            // Update Tab Buttons
            document.getElementById('btn-costumes').classList.remove('active');
            document.getElementById('btn-tshirts').classList.remove('active');
            document.getElementById('btn-' + tab).classList.add('active');

            // Update Forms
            document.getElementById('form-costumes').classList.remove('active');
            document.getElementById('form-tshirts').classList.remove('active');
            document.getElementById('form-' + tab).classList.add('active');

            // Reset the result box output to clear confusion between tabs
            document.getElementById('resultOutput').innerHTML = '<div class="empty-state">Fill out the form to generate your prompt...</div>';
            document.getElementById('copyBtn').style.display = 'none';
        }

        function toggleSetField() {
            const isSet = document.getElementById('c_isSet').checked;
            const setGroup = document.getElementById('setComponentsGroup');
            if (isSet) {
                setGroup.style.display = 'block';
            } else {
                setGroup.style.display = 'none';
                document.getElementById('c_setComponents').value = ''; 
            }
        }

        // Toggle Front/Back/Both Print Fields
        function togglePrintFields() {
            const printLoc = document.querySelector('input[name="t_printLocation"]:checked').value;
            const frontGroup = document.getElementById('t_frontPrintGroup');
            const backGroup = document.getElementById('t_backPrintGroup');

            if (printLoc === 'front') {
                frontGroup.style.display = 'block';
                backGroup.style.display = 'none';
                document.getElementById('t_backPrint').value = ''; // clear hidden field
            } else if (printLoc === 'back') {
                frontGroup.style.display = 'none';
                backGroup.style.display = 'block';
                document.getElementById('t_frontPrint').value = ''; // clear hidden field
            } else if (printLoc === 'both') {
                frontGroup.style.display = 'block';
                backGroup.style.display = 'block';
            }
        }

        // Helper function for A/An logic
        function getArticle(word) {
            if (!word || word === "[INSERT COLOUR]") return 'a'; 
            let firstLetter = word.charAt(0).toLowerCase();
            return ['a', 'e', 'i', 'o', 'u'].includes(firstLetter) ? 'an' : 'a';
        }

        function generatePrompt() {
            let promptText = "";

            if (currentTab === 'costumes') {
                const itemName = document.getElementById('c_itemName').value.trim() || "[INSERT PRODUCT NAME]";
                const eventRaw = document.getElementById('c_event').value.trim();
                const bannedTermsRaw = document.getElementById('c_bannedTerms').value.trim();
                const focusRaw = document.getElementById('c_focus').value.trim();
                const sizeGuideRaw = document.getElementById('c_sizeGuide').value.trim();
                const extraDetailsRaw = document.getElementById('c_extraDetails').value.trim();
                const isSet = document.getElementById('c_isSet').checked;
                const componentsRaw = document.getElementById('c_setComponents').value.trim();

                let article = getArticle(itemName);
                promptText = `This is ${article} ${itemName}`;
                
                if (eventRaw) {
                    promptText += ` for ${eventRaw}.`;
                } else {
                    promptText += `.`; 
                }

                if (isSet && componentsRaw) {
                    promptText += `\n\nThis product is a set that includes the following components: ${componentsRaw}.`;
                }

                if (bannedTermsRaw) {
                    let keywordSentence = "These terms can be used in the Generic Keywords for all channels.";
                    if (bannedTermsRaw.toLowerCase().includes("gildan")) {
                        keywordSentence = "These terms, except for Gildan, can be used in the Generic Keywords for all channels.";
                    }
                    promptText += `\n\nDo not use ${bannedTermsRaw} in the title, subtitle, short description, description or bullet points for any channel. ${keywordSentence}`;
                }

                if (focusRaw) {
                    promptText += `\n\nPlease make the listing ${focusRaw}-focused.`;
                }

                if (sizeGuideRaw) {
                    promptText += `\n\nThe size guide is as follows:\n${sizeGuideRaw}`;
                }

                if (extraDetailsRaw) {
                    promptText += `\n\nAdditional details:\n${extraDetailsRaw}`;
                }

            } else if (currentTab === 'tshirts') {
                const colourRaw = document.getElementById('t_colour').value.trim();
                const colour = colourRaw || "[INSERT COLOUR]";
                const styleText = document.querySelector('input[name="t_style"]:checked').value;
                const printLoc = document.querySelector('input[name="t_printLocation"]:checked').value;
                
                const frontPrint = document.getElementById('t_frontPrint').value.trim() || "[INSERT FRONT PRINT DESCRIPTION]";
                const backPrint = document.getElementById('t_backPrint').value.trim() || "[INSERT BACK PRINT DESCRIPTION]";

                const bannedTermsRaw = document.getElementById('t_bannedTerms').value.trim();
                const focusRaw = document.getElementById('t_focus').value.trim();
                const sizeGuideRaw = document.getElementById('t_sizeGuide').value.trim();
                const extraDetailsRaw = document.getElementById('t_extraDetails').value.trim();

                let article = getArticle(colour);
                
                promptText = `This product is ${article} ${colour} ${styleText}`;

                if (printLoc === 'front') {
                    promptText += ` with a ${frontPrint} print on the front.`;
                } else if (printLoc === 'back') {
                    promptText += ` with a ${backPrint} print on the back.`;
                } else if (printLoc === 'both') {
                    promptText += ` with a ${frontPrint} print on the front and a ${backPrint} print on the back.`;
                }

                if (bannedTermsRaw) {
                    let keywordSentence = "These terms can be used in the Generic Keywords for all channels.";
                    if (bannedTermsRaw.toLowerCase().includes("gildan")) {
                        keywordSentence = "These terms, except for Gildan, can be used in the Generic Keywords for all channels.";
                    }
                    promptText += `\n\nDo not use ${bannedTermsRaw} in the title, subtitle, short description, description or bullet points for any channel. ${keywordSentence}`;
                }

                if (focusRaw) {
                    promptText += `\n\nPlease make the listing ${focusRaw}-focused.`;
                }

                if (sizeGuideRaw) {
                    promptText += `\n\nThe size guide is as follows:\n${sizeGuideRaw}`;
                }

                if (extraDetailsRaw) {
                    promptText += `\n\nAdditional details:\n${extraDetailsRaw}`;
                }
            }

            // Output the result
            document.getElementById('resultOutput').textContent = promptText;
            document.getElementById('copyBtn').style.display = 'block';
            
            if(window.innerWidth < 900) {
                document.getElementById('resultOutput').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('resultOutput').textContent;
            const btn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('success');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('success');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy text. Please try selecting it manually.');
            });
        }
    </script>
</body>
</html>
