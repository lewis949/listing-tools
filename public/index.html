<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Tools | Claude Builder</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --accent-gradient: linear-gradient(135deg, #f43f5e, #8b5cf6, #3b82f6);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            /* Animated Aurora Background */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        @media (min-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Glassmorphism Panel */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .panel-title::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-gradient);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.4);
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-bottom: 1.5rem;
        }

        .toggle-container label {
            margin-bottom: 0;
            color: var(--text-main);
            text-transform: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--accent-gradient);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        #setComponentsGroup {
            display: none;
            animation: slideDown 0.3s ease-out forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button.primary-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
        }

        /* Result Section */
        .result-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 12px;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.8;
            height: calc(100% - 140px);
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .empty-state {
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            display: none;
        }
        
        .copy-btn:hover {
            background: var(--glass-highlight);
        }

        .copy-btn.success {
            background: rgba(16, 185, 129, 0.8);
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Listing Tools</h1>
        <p>Claude Collaboration Builder</p>
    </div>

    <div class="layout-grid">
        <div class="panel">
            <h2 class="panel-title">Product Details</h2>
            <form id="builderForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g. Orange Dress" required>
                </div>

                <div class="form-group">
                    <label for="event">Event (Optional)</label>
                    <input type="text" id="event" placeholder="e.g. the Summer Music Festival">
                </div>

                <div class="toggle-container">
                    <label for="isSet">Is this product a set?</label>
                    <label class="switch">
                        <input type="checkbox" id="isSet" onchange="toggleSetField()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-group" id="setComponentsGroup">
                    <label for="setComponents">Set Components</label>
                    <textarea id="setComponents" placeholder="e.g. 1x Top, 1x Skirt"></textarea>
                </div>

                <div class="form-group">
                    <label for="bannedTerms">Banned Terms (Optional)</label>
                    <input type="text" id="bannedTerms" placeholder="e.g. Vintage, Designer-inspired">
                </div>

                <div class="form-group">
                    <label for="focus">Focus Theme (Optional)</label>
                    <input type="text" id="focus" placeholder="e.g. concert, Halloween">
                </div>

                <div class="form-group">
                    <label for="sizeGuide">Size Guide (Optional)</label>
                    <textarea id="sizeGuide" placeholder="Paste accurate measurements here..."></textarea>
                </div>

                <button type="button" class="primary-btn" onclick="generatePrompt()">Generate Prompt</button>
            </form>
        </div>

        <div class="panel">
            <h2 class="panel-title">Generated Prompt</h2>
            <div id="resultOutput" class="result-box">
                <div class="empty-state">Fill out the form to generate your prompt...</div>
            </div>
            <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function toggleSetField() {
            const isSet = document.getElementById('isSet').checked;
            const setGroup = document.getElementById('setComponentsGroup');
            if (isSet) {
                setGroup.style.display = 'block';
            } else {
                setGroup.style.display = 'none';
                document.getElementById('setComponents').value = ''; 
            }
        }

        function generatePrompt() {
            // Get raw values and trim whitespace
            const itemNameRaw = document.getElementById('itemName').value.trim();
            const eventRaw = document.getElementById('event').value.trim();
            const bannedTermsRaw = document.getElementById('bannedTerms').value.trim();
            const focusRaw = document.getElementById('focus').value.trim();
            const sizeGuideRaw = document.getElementById('sizeGuide').value.trim();
            const isSet = document.getElementById('isSet').checked;
            const componentsRaw = document.getElementById('setComponents').value.trim();

            // Handle "a" vs "an" logic based on first letter
            let itemName = itemNameRaw || "[INSERT PRODUCT NAME]";
            let firstLetter = itemName.charAt(0).toLowerCase();
            let article = ['a', 'e', 'i', 'o', 'u'].includes(firstLetter) ? 'an' : 'a';

            // Start building the prompt dynamically
            let promptText = `This is ${article} ${itemName}`;
            
            // Add event if it exists
            if (eventRaw) {
                promptText += ` for ${eventRaw}.`;
            } else {
                promptText += `.`; // Just end the sentence if no event
            }

            // Add set components if it is a set
            if (isSet && componentsRaw) {
                promptText += `\n\nThis product is a set that includes the following components: ${componentsRaw}.`;
            }

            // Add banned terms conditionally
            if (bannedTermsRaw) {
                promptText += `\n\nDo not use ${bannedTermsRaw} in the title, subtitle, short description, description or bullet points for any channel. These terms can be used in the Generic Keywords for all channels.`;
            }

            // Add focus theme conditionally
            if (focusRaw) {
                promptText += `\n\nPlease make the listing ${focusRaw}-focused.`;
            }

            // Add size guide conditionally
            if (sizeGuideRaw) {
                promptText += `\n\nThe size guide is as follows:\n${sizeGuideRaw}`;
            }

            // Output the result
            document.getElementById('resultOutput').textContent = promptText;
            document.getElementById('copyBtn').style.display = 'block';
            
            if(window.innerWidth < 900) {
                document.getElementById('resultOutput').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('resultOutput').textContent;
            const btn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('success');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('success');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy text. Please try selecting it manually.');
            });
        }
    </script>
</body>
</html>
